# XcodeGen spec. Regenerate the project with:  cd ios && xcodegen generate
name: Farecart
options:
  bundleIdPrefix: org.farecart
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

attributes:
  LastUpgradeCheck: "2600"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    CODE_SIGN_STYLE: Automatic
    # Set your team here or in Xcode: Signing & Capabilities → Team.
    DEVELOPMENT_TEAM: 8U3DG28W84

packages:
  FarecartKit:
    path: FarecartKit

targets:
  Farecart:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Farecart
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: FarecartKit
        product: FarecartKit
    info:
      path: Farecart/Info.plist
      properties:
        CFBundleDisplayName: Farecart
        CFBundleName: Farecart
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        CFBundleLocalizations: [en, es, pl, zh-Hans, ar, fil, ur, uk, ko]
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "Farecart uses your location only to find grocery stores, food pantries and giveaways near you. It is never stored."
        LSApplicationQueriesSchemes:
          - comgooglemaps
        # farecart://auth-callback brings the app back from the hosted OAuth flow (Google).
        CFBundleURLTypes:
          - CFBundleURLName: org.farecart.app
            CFBundleURLSchemes: [farecart]
            CFBundleTypeRole: Editor
        # Runtime configuration, filled from Config/*.xcconfig.
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        API_BASE_URL: "$(API_BASE_URL)"
        REPORT_PROBLEM_EMAIL: "$(REPORT_PROBLEM_EMAIL)"
    # Sign in with Apple: Farecart/Farecart.entitlements (com.apple.developer.applesignin) is a
    # committed file; CODE_SIGN_ENTITLEMENTS points at it per configuration in Config/*.xcconfig
    # (Release only, because personal/free teams cannot sign that entitlement; Debug on a device
    # then shows a friendly error on the Apple button). Enable the capability for this bundle id
    # on your Apple Developer team before a Release build on a device. Do not add a second
    # `properties:` key here: YAML would replace `info.properties` above and empty Info.plist.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.farecart.app
        PRODUCT_NAME: Farecart
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"

schemes:
  Farecart:
    build:
      targets:
        Farecart: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: FarecartKit/FarecartKitTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
